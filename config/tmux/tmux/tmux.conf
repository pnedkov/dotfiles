# General
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Go to the beginning/end of line
bind a send-keys C-a
bind e send-keys C-e

set-option -g focus-events on
set-option -g renumber-windows on
set-option -g history-limit 100000

set -g status on

set -s set-clipboard on

# Show visual notifications for bells in background windows
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell on

# Start from 1 for window and pane (instead of 0)
set -g base-index 1
set -g pane-base-index 1

set -gw mode-keys emacs
set -gw status-keys emacs
# exit copy mode with Esc (default) and Enter
bind -T copy-mode Enter send-keys -X cancel

# UTF8
#setw -g utf8 on
#set -g status-utf8 on

# Screen mode
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Reload conf file
bind r source-file -F "#{?#{E:XDG_CONFIG_HOME},#{E:XDG_CONFIG_HOME},#{E:HOME}/.config}/tmux/tmux.conf" \; display-message "Config reloaded..."

# Respawn pane
bind R confirm-before -p "Respawn pane? (y/n)" "respawn-pane -k"

# Splitting
unbind %
unbind '"'
bind c new-window -a -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Activity monitoring
#setw -g monitor-activity on
#set -g visual-activity on

# Terminal emulator window title
set -g set-titles on
set -g set-titles-string '[#S:#I #H] #W [#T]'
setw -g allow-rename off

# Resize panes with Shift and arrows
bind -n S-Left resize-pane -L 5
bind -n S-Right resize-pane -R 5
bind -n S-Up resize-pane -U 5
bind -n S-Down resize-pane -D 5

# Switch panes with Alt/Meta and arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-[ previous-window
bind -n M-] next-window

# Switch windows with Alt/Meta and number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Synchronize-panes
bind y setw synchronize-panes

# Mouse support
bind m setw mouse \; display "Mouse: #{?mouse,ON,OFF}"

# Delay for escape key press
set -sg escape-time 100

# Tmux Plugin Manager
set-environment -g -F TMUX_PLUGIN_MANAGER_PATH "#{?#{E:XDG_DATA_HOME},#{E:XDG_DATA_HOME}/tmux/plugins,#{E:HOME}/.tmux/plugins}"
set -g @plugin 'tmux-plugins/tpm'

# Tmux PowerKit
set -g @plugin 'fabioluciano/tmux-powerkit'

set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'

set -g @powerkit_transparent 'false'
set -g @powerkit_separator_style 'normal'
set -g @powerkit_elements_spacing 'both'
set -g @powerkit_keybinding_conflict_action 'ignore'

set -g @powerkit_plugins 'battery,hostname'
set -g @powerkit_status_order 'session,plugins'
set -g @powerkit_status_position 'bottom'

# Install TPM and plugins if missing
if-shell 'test ! -x "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"' {
  run-shell 'mkdir -p "$TMUX_PLUGIN_MANAGER_PATH" && \
    git clone https://github.com/tmux-plugins/tpm "$TMUX_PLUGIN_MANAGER_PATH/tpm" && \
    "$TMUX_PLUGIN_MANAGER_PATH/tpm/bin/install_plugins"'
}

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell '"$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"'
